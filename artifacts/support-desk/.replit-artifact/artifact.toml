kind = "web"
previewPath = "/"
title = "SupportDesk"
version = "1.0.0"
id = "artifacts/support-desk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22289

[services.development]
run = "pnpm --filter @workspace/support-desk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/support-desk", "run", "build" ]
publicDir = "artifacts/support-desk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22289"
BASE_PATH = "/"
